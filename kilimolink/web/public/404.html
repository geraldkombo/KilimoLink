<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KilimoLink Direct</title>
    <script>
      // GitHub Pages fallback for React Router deep links.
      // Converts /KilimoLink/county-dashboard to /KilimoLink/?/county-dashboard
      // so the SPA can restore the intended route.
      const base = '/KilimoLink';
      const path = window.location.pathname;
      const route = path.startsWith(base) ? path.slice(base.length) : path;
      window.location.replace(`${base}/?${route}${window.location.search.replace(/^\?/, '&')}${window.location.hash}`);
    </script>
  </head>
  <body>
    <p>Loading KilimoLink...</p>
  </body>
</html>
