<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KilimoLink Direct</title>
    <script>
      // HashRouter redirect for GitHub Pages SPA fallback
      var base = '/KilimoLink';
      var path = window.location.pathname;
      var route = path.startsWith(base) ? path.slice(base.length) : path;
      if (route && !route.startsWith('/#')) {
        window.location.replace(base + '/#/' + route.replace(/^\//, ''));
      }
    </script>
  </head>
  <body>
    <p>Redirecting to KilimoLink...</p>
  </body>
</html>
