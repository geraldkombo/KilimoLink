services:
  - type: web
    name: kilimolink-api
    env: node
    region: frankfurt
    plan: free
    buildCommand: cd backend && npm install --legacy-peer-deps && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma db push; node dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DISABLE_REDIS
        value: "true"
      - key: MOCK_PAYMENTS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: kilimolink-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: kilimolink-db
    plan: free
    region: frankfurt
    databaseName: kilimolink
    user: kilimolink
