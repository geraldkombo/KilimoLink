name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'kilimolink/web/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kilimolink/web/package-lock.json
      - name: Install
        working-directory: kilimolink/web
        run: npm ci
      - name: Build
        working-directory: kilimolink/web
        run: npm run build
        env:
          VITE_API_BASE_URL: https://kilimolink.pages.dev/api/v1
      - uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: kilimolink/web/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5