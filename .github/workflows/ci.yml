name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: kilimolink
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kilimolink?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-test-secret
      DOCUMENTS_MASTER_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma Client
        run: pnpm -C backend prisma:generate

      - name: Push DB schema
        run: pnpm -C backend exec prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kilimolink?schema=public

      - name: Lint backend
        run: pnpm --filter @kilimolink/backend lint
        continue-on-error: true

      - name: Run backend tests
        run: pnpm --filter @kilimolink/backend test --reporter default

      - name: Lint frontend
        run: pnpm --filter @kilimolink/web lint
        continue-on-error: true

      - name: Build frontend
        run: pnpm --filter @kilimolink/web build

      - name: Run frontend tests
        run: pnpm --filter @kilimolink/web test
        continue-on-error: true

      - name: Build backend
        run: pnpm --filter @kilimolink/backend build
