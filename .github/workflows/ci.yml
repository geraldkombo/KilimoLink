name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: kilimolink
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kilimolink?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-test-secret
      DOCUMENTS_MASTER_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DISABLE_REDIS: "true"
      MOCK_PAYMENTS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install backend deps
        run: cd kilimolink/backend && npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: cd kilimolink/backend && npx prisma generate

      - name: Push DB schema
        run: cd kilimolink/backend && npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kilimolink?schema=public

      - name: Build backend
        run: cd kilimolink/backend && npm run build

      - name: Run backend tests
        run: cd kilimolink/backend && npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kilimolink?schema=public

      - name: Install frontend deps
        run: cd kilimolink/web && npm install

      - name: Build frontend
        run: cd kilimolink/web && npm run build

      - name: Run frontend tests
        run: cd kilimolink/web && npm run test --if-present

  edge-api-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Live edge API smoke test
        run: |
          set -e
          B=https://kilimolink.pages.dev/api/v1
          curl -sf "$B/health" | grep -q '"status":"ok"'
          curl -sf "$B/products?limit=5" | grep -q '"products"'
          curl -sf "$B/impact" | grep -q '"completedOrders"'
          curl -sf "$B/oracle/prices?product=grains" | grep -q '"KES"'
          curl -sf "$B/ai/price-truth/tomatoes" | grep -q '"referencePrice"'
          curl -sf "$B/market/disruption-alerts" | grep -q '"active"'
          echo "edge API smoke: OK"
