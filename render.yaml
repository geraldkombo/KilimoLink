services:
  - type: web
    name: kilimolink-api
    runtime: node
    rootDir: kilimolink/backend
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISABLE_REDIS
        value: "true"
      - key: MOCK_PAYMENTS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kilimolink-db
          property: connectionString

databases:
  - name: kilimolink-db
    plan: free
    region: ohio
    databaseName: kilimolink
    user: kilimolink
